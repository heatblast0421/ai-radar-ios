# Builds and tests the iPhone app on a real Mac (GitHub-hosted, free for public repos),
# then captures simulator screenshots against the live backend for visual QA.
name: iOS build & test

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: write   # publishes screenshots + build summary to the 'ci-results' branch

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          data = json.load(sys.stdin)["devices"]
          best = None
          for runtime, devs in data.items():
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not m:
                  continue
              ver = (int(m.group(1)), int(m.group(2)))
              for d in devs:
                  if d["name"].startswith("iPhone") and "Pro Max" not in d["name"] and "SE" not in d["name"]:
                      if best is None or ver > best[0]:
                          best = (ver, d["udid"], d["name"])
          print(best[1]); print(best, file=sys.stderr)')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build for device (unsigned) to catch device-only issues
        run: |
          set -o pipefail
          mkdir -p ci
          xcodebuild build -project ios/AIRadar.xcodeproj -scheme AIRadar -configuration Release \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO -derivedDataPath build/device \
            2>&1 | tee ci/device-build.log | grep -E "error:|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" ci/device-build.log

      - name: Run unit tests on simulator
        timeout-minutes: 20
        run: |
          set -o pipefail
          xcodebuild test -project ios/AIRadar.xcodeproj -scheme AIRadar \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee ci/test.log | grep -E "error:|warning:|Test Case|Executed|TEST" || true
          grep -q "TEST SUCCEEDED" ci/test.log

      - name: Screenshots against the live backend
        if: always()
        timeout-minutes: 15
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          mkdir -p ci/shots
          exec > >(tee ci/shots.log) 2>&1
          # run a command with a time limit (macOS has no `timeout`)
          tl() { local secs=$1; shift; "$@" & local pid=$!; ( sleep "$secs"; kill -9 $pid 2>/dev/null ) >/dev/null 2>&1 & local w=$!; wait $pid; local rc=$?; kill $w 2>/dev/null; return $rc; }
          APP=$(find build/sim/Build/Products -name "AIRadar.app" -maxdepth 3 | head -1)
          echo "app: $APP"
          if [ -z "$APP" ]; then echo "no app built"; exit 0; fi
          xcrun simctl list devices | grep "$UDID" || true
          tl 120 xcrun simctl boot "$UDID" || echo "boot rc=$?"
          tl 240 xcrun simctl bootstatus "$UDID" || echo "bootstatus rc=$?"
          tl 30 xcrun simctl ui "$UDID" appearance dark || echo "appearance rc=$?"
          tl 120 xcrun simctl install "$UDID" "$APP" || echo "install rc=$?"
          BASE=https://heatblast0421.github.io/ai-radar-ios/api/v1
          ITEM=$(curl -s -m 20 $BASE/feed/pulse/top/1.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["items"][0]["id"])' || echo "")
          REPO=$(curl -s -m 20 $BASE/github/emerging/1.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["items"][0]["file_id"])' || echo "")
          echo "item=$ITEM repo=$REPO"
          shot() {
            echo "== $1"
            tl 20 xcrun simctl terminate "$UDID" com.heatblast0421.airadar 2>/dev/null || true
            tl 60 xcrun simctl launch "$UDID" com.heatblast0421.airadar "${@:2}" || echo "launch rc=$?"
            sleep 12
            tl 30 xcrun simctl io "$UDID" screenshot "ci/shots/$1.png" || echo "screenshot rc=$?"
          }
          shot 1-pulse -AIRadarStartTab pulse
          shot 2-github -AIRadarStartTab github
          shot 3-research -AIRadarStartTab research
          shot 4-lab -AIRadarStartTab lab
          shot 5-industry -AIRadarStartTab industry
          if [ -n "$ITEM" ]; then shot 6-item -AIRadarStartTab pulse -AIRadarStartScreen "item:$ITEM"; fi
          if [ -n "$REPO" ]; then shot 7-repo -AIRadarStartTab github -AIRadarStartScreen "repo:$REPO"; fi
          shot 8-settings -AIRadarStartTab pulse -AIRadarStartScreen settings
          shot 9-search -AIRadarStartTab pulse -AIRadarStartScreen search
          tl 30 xcrun simctl ui "$UDID" appearance light || true
          shot 10-pulse-light -AIRadarStartTab pulse
          ls -la ci/shots

      - name: Publish results to the 'ci-results' branch (readable without artifact downloads)
        if: always()
        timeout-minutes: 5
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/ci && cp -R ci/. /tmp/ci/ 2>/dev/null || true
          cd /tmp/ci
          for f in device-build.log test.log; do
            [ -f "$f" ] && { grep -E "error:|warning:|failed|FAILED|SUCCEEDED|Executed" "$f" | head -400 > "${f%.log}-summary.txt"; tail -c 900000 "$f" > "$f.tail"; rm "$f"; }
          done
          echo "${{ github.sha }} ${{ job.status }}" > STATUS
          git init -q -b ci-results
          git config user.name "ai-radar-bot"; git config user.email "ai-radar-bot@users.noreply.github.com"
          git add -A && git commit -q -m "CI results ${{ github.sha }}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" ci-results
