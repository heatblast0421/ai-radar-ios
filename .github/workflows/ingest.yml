# The AI Radar "backend": every 15 minutes, collect sources, rank, explain, and publish the JSON API to GitHub Pages.
name: Ingest & publish

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Job groups to run now (comma-separated), or 'all'. Empty = only what is due."
        required: false
        default: ""

permissions:
  contents: write   # save the database to the 'data' branch
  pages: write      # publish the JSON API
  id-token: write   # required by GitHub Pages deployments
  actions: write    # keep the scheduled workflow enabled

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install
        run: pip install -r backend/requirements.txt

      - name: Restore database from the 'data' branch
        run: |
          mkdir -p backend/data
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=1 origin data
            git show origin/data:radar.db.gz | gunzip > backend/data/radar.db
            echo "Restored database ($(du -h backend/data/radar.db | cut -f1))"
          else
            echo "No data branch yet - starting a fresh database"
          fi

      - name: Run pipeline
        working-directory: backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_MAX_CALLS_PER_RUN: ${{ vars.LLM_MAX_CALLS_PER_RUN }}
          LLM_MAX_CALLS_PER_DAY: ${{ vars.LLM_MAX_CALLS_PER_DAY }}
          LLM_MAX_TOKENS_PER_DAY: ${{ vars.LLM_MAX_TOKENS_PER_DAY }}
          AIRADAR_DISABLED_SOURCES: ${{ vars.AIRADAR_DISABLED_SOURCES }}
        run: python -m airadar.cli run --force "${{ inputs.force }}"

      - name: Save database to the 'data' branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd backend/data
          python - <<'EOF'
          import sqlite3
          c = sqlite3.connect("radar.db")
          c.execute("PRAGMA wal_checkpoint(TRUNCATE)")
          c.execute("PRAGMA journal_mode=DELETE")
          c.execute("VACUUM")
          c.close()
          EOF
          mkdir -p /tmp/databranch && gzip -c radar.db > /tmp/databranch/radar.db.gz
          cp ../site/api/v1/last_run.json /tmp/databranch/ || true
          cd /tmp/databranch
          git init -q -b data
          git config user.name "ai-radar-bot"
          git config user.email "ai-radar-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" data

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: backend/site
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Keep the schedule alive (GitHub pauses idle schedules after 60 days)
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(date -u +%H%M)" \< "0015" ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/ingest.yml/enable" || true
          fi
