# AI Radar source configuration.
# Add, remove or disable sources here; no code changes needed.
# credibility: 0..1, used transparently in ranking. official = first-party announcement from the organisation itself.

[schedule]  # minimum minutes between runs of each job group (the GitHub workflow wakes every 15 minutes)
hackernews        = 15
rss_official      = 30
rss_engineering   = 60
rss_industry      = 60
github_discovery  = 120
github_snapshots  = 360
github_releases   = 60
trending_pages    = 180
arxiv             = 360
hf_papers         = 120
hf_models         = 180
briefing          = 1440   # daily briefing (generated once per UTC day, after 00:30 UTC = 06:00 IST)

[limits]
max_item_age_days      = 45     # items older than this are pruned from the feed
feed_page_size         = 30
feed_max_items         = 360    # per section
max_tracked_repos      = 450
hn_min_points          = 12
arxiv_max_results      = 150

[catalog]
sources = [
  # ---------- Official AI company & lab announcements ----------
