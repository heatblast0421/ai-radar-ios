[github]
# Topic searches for emerging repositories (created recently, sorted by stars).
discovery_topics = [
  "ai-agents", "agents", "agentic-ai", "llm", "large-language-models", "mcp", "mcp-server",
  "model-context-protocol", "rag", "retrieval-augmented-generation", "llm-inference", "inference",
  "llmops", "llm-evaluation", "evals", "multi-agent", "agent-framework", "vector-database",
  "generative-ai", "claude-code", "coding-agent", "ai-memory", "fine-tuning", "local-llm",
]
discovery_keywords = ["agent harness", "agent memory", "mcp server", "context engineering", "llm inference engine"]
created_within_days = 60
min_stars_new = 40

# Important frameworks whose releases and metrics are always tracked (missing/renamed repos are skipped and reported).
curated_repos = [
  "anthropics/claude-code", "anthropics/anthropic-sdk-python", "openai/codex", "openai/openai-agents-python",
  "openai/openai-python", "modelcontextprotocol/specification", "modelcontextprotocol/python-sdk",
  "modelcontextprotocol/typescript-sdk", "modelcontextprotocol/servers", "google-gemini/gemini-cli", "google/adk-python",
  "langchain-ai/langchain", "langchain-ai/langgraph", "run-llama/llama_index", "crewAIInc/crewAI", "microsoft/autogen",
  "pydantic/pydantic-ai", "huggingface/smolagents", "agno-agi/agno", "stanfordnlp/dspy", "BerriAI/litellm",
  "vllm-project/vllm", "sgl-project/sglang", "ollama/ollama", "ggml-org/llama.cpp", "huggingface/transformers",
  "NVIDIA/TensorRT-LLM", "unslothai/unsloth", "mem0ai/mem0", "letta-ai/letta", "langfuse/langfuse",
  "Arize-ai/phoenix", "deepset-ai/haystack", "browser-use/browser-use", "All-Hands-AI/OpenHands",
